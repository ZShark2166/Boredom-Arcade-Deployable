    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const status = document.getElementById('lumin-status');
            const gameId = new URLSearchParams(window.location.search).get('id');

            if (!gameId) {
                status.innerHTML = '<p><strong>Game unavailable</strong>Return to the games page and choose a game.</p>';
                return;
            }

            try {
                await Lumin.init({ headless: true });
                const result = await Lumin.getGameUrl(gameId);
                const registration = await registerSW();
                if (registration.installing || registration.waiting) {
                    await new Promise((resolve) => {
                        const worker = registration.installing || registration.waiting;
                        worker.addEventListener('statechange', () => {
                            if (worker.state === 'activated') resolve();
                        });
                    });
                }
                const iframe = document.getElementById('game-iframe');
                iframe.title = result.meta?.name || 'Game';
                iframe.src = __math$config.prefix + __math$config.encodeUrl(result.url);
                document.title = `Home | Classroom`;
                await renderLuminSuggestions(gameId);
                status.remove();
            } catch (error) {
                console.error('Lumin loader error:', error);
                status.innerHTML = '<p><strong>Game could not be loaded</strong>Return to the games page and try again.</p>';
            }
        });

        async function renderLuminSuggestions(currentGameId) {
            const container = document.getElementById('suggestions-container');
            const result = await Lumin.getGames({ page: 1, limit: 100 });
            const games = result.games
                .filter((game) => game.id !== currentGameId)
                .sort(() => Math.random() - 0.5)
                .slice(0, 5);
            const imageUrls = await Promise.all(
                games.map((game) => Lumin.getImageUrl(game.image_token))
            );

            container.replaceChildren();
            games.forEach((game, index) => {
                const link = document.createElement('a');
                link.className = 'suggestion-card';
                link.href = `/gameloaders/lumin.html?id=${encodeURIComponent(game.id)}`;
                link.setAttribute('aria-label', `Play ${game.name}`);

                const image = document.createElement('img');
                image.src = imageUrls[index];
                image.alt = game.name;
                image.loading = 'lazy';

                const name = document.createElement('p');
                name.textContent = game.name;

                link.append(image, name);
                container.appendChild(link);
            });
        }
    </script>
