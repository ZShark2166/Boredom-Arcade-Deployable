<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boredom Arcade - Rewarded Ad Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        button {
            padding: 14px 24px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
        }

        #status {
            margin-top: 20px;
            color: #aaa;
        }
    </style>

    <script async
    src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"
    crossorigin="anonymous"></script>

<script>
window.googletag = window.googletag || { cmd: [] };

googletag.cmd.push(function () {

    const rewardedSlot = googletag.defineOutOfPageSlot(
        '/23375553075/game-rewarded',
        googletag.enums.OutOfPageFormat.REWARDED
    );

    if (!rewardedSlot) {
        console.log('defineOutOfPageSlot returned null');
        return;
    }

    rewardedSlot.addService(googletag.pubads());

    googletag.pubads().addEventListener(
        'rewardedSlotReady',
        function (event) {
            console.log('REWARDED AD READY');

            if (confirm('Watch the rewarded ad?')) {
                event.makeRewardedVisible();
            } else {
                googletag.destroySlots([rewardedSlot]);
            }
        }
    );

    googletag.pubads().addEventListener(
        'rewardedSlotGranted',
        function (event) {
            console.log('REWARD GRANTED:', event.payload);
        }
    );

    googletag.pubads().addEventListener(
        'rewardedSlotClosed',
        function (event) {
            console.log('REWARDED AD CLOSED');
            googletag.destroySlots([rewardedSlot]);
        }
    );

    googletag.enableServices();
    googletag.display(rewardedSlot);
});
</script>
</head>

<body>

    <h1>Rewarded Ad Test</h1>

    <p>
        This page tests the Boredom Arcade rewarded ad unit.
    </p>

    <button id="watch-ad" disabled>
        Loading ad...
    </button>

    <div id="status">
        Waiting for rewarded ad...
    </div>

    <h2 id="result"></h2>

</body>
</html>
