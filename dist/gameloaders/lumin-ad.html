<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading game</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, sans-serif;
            background: #090b16;
            color: #e6e6ff;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            display: grid;
            place-items: center;
            text-align: center;
        }

        strong {
            display: block;
            margin-bottom: 0.45rem;
            color: #a9b7ff;
            font-size: 1.15rem;
        }
    </style>
    <!-- Google H5 Games Ads -->
    <script
        async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2779999647710891"
        crossorigin="anonymous">
    </script>
    <script>
        window.adsbygoogle = window.adsbygoogle || [];

        var adBreak = adConfig = function(o) {
            adsbygoogle.push(o);
        };

        adConfig({
            preloadAdBreaks: 'on',
            sound: 'on'
        });
    </script>
</head>
<body>
    <p id="status"><strong>Loading game...</strong>Please wait while the game starts.</p>

    <script src="/static/math/math.bundle.js"></script>
    <script src="/static/math/math.config.js"></script>
    <script src="/static/register-sw.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const status = document.getElementById('status');
            const gameId = new URLSearchParams(window.location.search).get('id');

            if (!gameId) {
                status.innerHTML = '<strong>Game unavailable</strong>Return to the games page and choose a game.';
                return;
            }

            try {
                await Lumin.init({ headless: true });
                const result = await Lumin.getGameUrl(gameId);
                const registration = await registerSW();
                if (registration.installing || registration.waiting) {
                    await new Promise((resolve) => {
                        const worker = registration.installing || registration.waiting;
                        worker.addEventListener('statechange', () => {
                            if (worker.state === 'activated') resolve();
                        });
                    });
                }

                adBreak({
                    type: 'preroll',
                    name: `lumin-game-${gameId}`,
                    adBreakDone: (placementInfo) => {
                        console.log('H5 ad finished:', placementInfo);
                        document.title = result.meta?.name || 'Game';
                        window.location.replace(
                            __math$config.prefix + __math$config.encodeUrl(result.url)
                        );
                    }
                });
            } catch (error) {
                console.error('Lumin iframe loader error:', error);
                status.innerHTML = '<strong>Game could not be loaded</strong>Return to the games page and try again.';
            }
        });
    </script>
</body>
</html>
