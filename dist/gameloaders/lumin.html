<!DOCTYPE html>

    <style>
        .lumin-loader-status {
            display: grid;
            min-height: 100%;
            place-items: center;
            padding: 2rem;
            color: rgba(var(--text-color-rgb, 230, 230, 255), 0.72);
            text-align: center;
        }

        .lumin-loader-status strong {
            display: block;
            margin-bottom: 0.45rem;
            color: var(--accent-color);
            font-size: 1.15rem;
        }

        .lumin-game-suggestions {
            width: min(100%, 1200px);
            margin-top: 1.5rem;
        }

        .lumin-game-suggestions #suggestions-container {
            width: 100%;
        }
        .pre-game-ad {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px;
            min-height: 400px;
            text-align: center;
        }

        .pre-game-ad .ad-label {
            font-size: 12px;
            color: rgba(var(--text-color-rgb, 230, 230, 255), 0.55);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .pre-game-ad .adsbygoogle {
            display: inline-block;
            width: 300px;
            height: 250px;
        }

        .pre-game-ad button {
            padding: 10px 22px;
            border: 0;
            border-radius: 8px;
            background: var(--accent-color);
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .pre-game-ad button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>

    <script src="/static/math/math.bundle.js"></script>
    <script src="/static/math/math.config.js"></script>
    <script src="/static/register-sw.js"></script>
    <script src="../index.js"></script>
    <script src="options.js"></script>
    <script src="../stars.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
    <script src="/ads.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const status = document.getElementById('lumin-status');
            const gameId = new URLSearchParams(window.location.search).get('id');

            if (!gameId) {
                status.innerHTML = '<p><strong>Game unavailable</strong>Return to the games page and choose a game.</p>';
                return;
            }

            try {
                await Lumin.init({ headless: true });
                const result = await Lumin.getGameUrl(gameId);
                const registration = await registerSW();
                if (registration.installing || registration.waiting) {
                    await new Promise((resolve) => {
                        const worker = registration.installing || registration.waiting;
                        worker.addEventListener('statechange', () => {
                            if (worker.state === 'activated') resolve();
                        });
                    });
                }
                const iframe = document.getElementById('game-iframe');
                const preGameAd = document.getElementById('pre-game-ad');
                const continueButton = document.getElementById('continue-game');

                iframe.title = result.meta?.name || 'Game';

                const gameUrl = __math$config.prefix + __math$config.encodeUrl(result.url);

                document.title = `Home | Classroom`;

                status.remove();
                preGameAd.style.display = 'flex';

                // Request the AdSense ad
                try {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                } catch (error) {
                    console.error('AdSense error:', error);
                }

                // Give the ad a moment to request before allowing the user onward.
                // This does NOT require the ad to fill.
                setTimeout(() => {
                    continueButton.disabled = false;
                }, 1500);

                continueButton.addEventListener('click', () => {
                    preGameAd.remove();

                    iframe.style.display = 'block';
                    iframe.src = gameUrl;
                });

                await renderLuminSuggestions(gameId);
            } catch (error) {
                console.error('Lumin loader error:', error);
                status.innerHTML = '<p><strong>Game could not be loaded</strong>Return to the games page and try again.</p>';
            }
        });

        async function renderLuminSuggestions(currentGameId) {
            const container = document.getElementById('suggestions-container');
            const result = await Lumin.getGames({ page: 1, limit: 100 });
            const games = result.games
                .filter((game) => game.id !== currentGameId)
                .sort(() => Math.random() - 0.5)
                .slice(0, 5);
            const imageUrls = await Promise.all(
                games.map((game) => Lumin.getImageUrl(game.image_token))
            );

            container.replaceChildren();
            games.forEach((game, index) => {
                const link = document.createElement('a');
                link.className = 'suggestion-card';
                link.href = `/gameloaders/lumin.html?id=${encodeURIComponent(game.id)}`;
                link.setAttribute('aria-label', `Play ${game.name}`);

                const image = document.createElement('img');
                image.src = imageUrls[index];
                image.alt = game.name;
                image.loading = 'lazy';

                const name = document.createElement('p');
                name.textContent = game.name;

                link.append(image, name);
                container.appendChild(link);
            });
        }
    </script>
